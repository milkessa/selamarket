<style>
:root{
  --g:#0B6B57; --g2:#085846; --g3:#0F7C66; --cream:#F6E8C8; --gold:#D49A1F; --red:#B3343F;
  --bg:#F6F5F1; --surface:#FFFFFF; --line:#DEDAD0; --ink:#1B1F1A; --muted:#5E625A; --soft:#DCEEE7;
  --display:"Bricolage Grotesque","Noto Sans Ethiopic",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic","Nyala",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121512; --surface:#1B201C; --line:#2E352F; --ink:#ECEEE8; --muted:#A3A99F; --soft:#163A30; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121512; --surface:#1B201C; --line:#2E352F; --ink:#ECEEE8; --muted:#A3A99F; --soft:#163A30; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
:lang(am) body,[lang="am"]{line-height:1.65}
a{color:inherit}
.tib{height:12px;background:repeating-linear-gradient(90deg,var(--g) 0 34px,var(--gold) 34px 44px,var(--red) 44px 54px,var(--gold) 54px 64px,var(--cream) 64px 96px,var(--gold) 96px 102px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(900px 600px at 50% 30%,var(--g3) 0%,var(--g) 55%,var(--g2) 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.08;background:linear-gradient(45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%);background-size:44px 44px}
.hero .wrap{position:relative;padding-top:18px;padding-bottom:56px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px}
.mini{font:800 20px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.mini .a{font-family:"Noto Sans Ethiopic",sans-serif;color:var(--cream)}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
.langs button{border:0;background:none;color:#fff;font:600 14px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--cream);color:#1B1F1A}
.tag{display:inline-block;border:1.5px solid rgba(246,232,200,.55);color:var(--cream);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.tag[lang="am"],.tag[lang="om"]{letter-spacing:0;text-transform:none}
.logo{margin:22px 0 6px;font:800 clamp(56px,13vw,124px)/1 var(--display);letter-spacing:-.03em;white-space:nowrap}
.logo .a{font-family:"Noto Sans Ethiopic",sans-serif;color:var(--cream);position:relative;display:inline-block}
.logo .a::after{content:"";position:absolute;left:0;right:0;bottom:-.12em;height:.09em;background:repeating-linear-gradient(90deg,var(--gold) 0 .14em,var(--red) .14em .19em,var(--cream) .19em .28em)}
.lead{max-width:640px;margin:34px auto 0;font-size:clamp(17px,2.4vw,20px);color:#E3F1EC}
.label{margin-top:34px;font:700 15px var(--body);color:var(--cream);letter-spacing:.06em;text-transform:uppercase}
.label:lang(am),.label:lang(om){letter-spacing:0;text-transform:none}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px;margin:14px auto 0}
.unit{background:var(--cream);color:#1B1F1A;border-radius:18px;padding:16px 4px 12px;box-shadow:0 14px 30px rgba(0,0,0,.18);position:relative;overflow:hidden}
.unit::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--red) 10px 14px,var(--g) 14px 20px)}
.num{display:block;font:800 clamp(34px,9vw,58px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--g)}
.u{display:block;margin-top:6px;font-size:13px;font-weight:600;color:#5E625A}
.when{margin-top:18px;font-weight:600;color:#fff}
.local{margin-top:4px;font-size:14px;color:#CDE5DC}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px}
.btn.gold{background:var(--gold);color:#1B1F1A}
.btn.line{border:1.5px solid rgba(255,255,255,.6);color:#fff}
.btn svg{width:20px;height:20px;flex:none}
.open{display:none;margin-top:22px;font:800 24px var(--display);color:var(--cream)}

/* features */
section{padding:56px 0 8px}
h2{font:800 clamp(28px,5vw,40px)/1.15 var(--display);letter-spacing:-.02em;text-align:center}
h2:lang(am){font-family:"Noto Sans Ethiopic",sans-serif;letter-spacing:0}
.sub{text-align:center;color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.feat .pic{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--soft)}
.feat .pic img{width:100%;height:100%;object-fit:cover;display:block}
.feat .pic .n{position:absolute;left:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;font:800 18px var(--display);display:flex;align-items:center;justify-content:center}
.feat .tx{padding:18px 20px 22px}
.feat h3{font:800 22px/1.2 var(--display);letter-spacing:-.01em}
.feat h3:lang(am){font-family:"Noto Sans Ethiopic",sans-serif;letter-spacing:0}
.feat p{margin-top:6px;color:var(--muted)}
.partner{margin-top:16px;display:grid;grid-template-columns:200px 1fr;gap:0;background:var(--g);color:#fff;border-radius:22px;overflow:hidden}
.partner img{width:100%;height:100%;object-fit:cover;display:block}
.partner .tx{padding:22px 22px 24px}
.partner h3{font:800 22px var(--display);color:var(--cream)}
.partner h3:lang(am){font-family:"Noto Sans Ethiopic",sans-serif}
.partner p{margin-top:6px;color:#E3F1EC}
.partner .btn{margin-top:14px}
@media (max-width:560px){.partner{grid-template-columns:1fr}.partner img{aspect-ratio:16/8}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px;counter-reset:s}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.step b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#1B1F1A;font:800 17px var(--display);display:flex;align-items:center;justify-content:center}
.step span{font-weight:600;padding-top:6px}
.notify{margin:56px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center}
.notify h3{font:800 24px var(--display)}
.notify h3:lang(am){font-family:"Noto Sans Ethiopic",sans-serif}
.notify .btn{margin-top:14px;background:var(--g);color:#fff}
.langline{margin-top:10px;color:var(--muted);font-size:14px}
footer{padding:36px 0 40px;text-align:center;color:var(--muted);font-size:14px}
footer .mini{color:var(--ink);font-size:22px;margin-bottom:6px}
footer .mini .a{color:var(--g)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer .mini .a{color:var(--cream)}}
@media (prefers-reduced-motion:no-preference){.num.tick{animation:tick .35s ease}@keyframes tick{0%{transform:translateY(-6px);opacity:.4}100%{transform:none;opacity:1}}}
</style>
</head>

function store(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var lang=store("sm-lang")||"en";if(!T[lang])lang="en";
function applyLang(){var d=T[lang];document.documentElement.lang=lang;
  [].forEach.call(document.querySelectorAll("[data-t]"),function(el){var k=el.getAttribute("data-t");if(d[k]!=null){el.textContent=d[k];el.setAttribute("lang",lang)}});
  [].forEach.call(document.querySelectorAll("[data-lang]"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===lang))});
  try{document.getElementById("local").textContent=d.local+new Date(LAUNCH).toLocaleString(lang==="am"?"am-ET":lang==="om"?"om-ET":"en-CA",{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){}}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-lang]");if(b){lang=b.getAttribute("data-lang");store("sm-lang",lang);applyLang()}});

var last={};function set(id,v){v=(v<10?"0":"")+v;var el=document.getElementById(id);if(last[id]!==v){el.textContent=v;el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick");last[id]=v}}
function tick(){var ms=LAUNCH-Date.now();
  if(ms<=0){set("d",0);set("h",0);set("m",0);set("s",0);document.getElementById("open").style.display="block";
    try{localStorage.removeItem("sm-preview")}catch(e){}setTimeout(function(){location.replace("./")},2500);return}
  var s=Math.floor(ms/1000);set("d",Math.floor(s/86400));set("h",Math.floor(s%86400/3600));set("m",Math.floor(s%3600/60));set("s",s%60);
  setTimeout(tick,1000-(Date.now()%1000))}
