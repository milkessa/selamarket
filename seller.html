<style>
/* Seller portal: same Selam identity as the shop. Single column on phones, form beside list on desktop. */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunk:#EEECE6; --line:#DEDAD0;
  --ink:#1B1F1A; --muted:#5E625A;
  --accent:#0B6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEEE7;
  --gold:#D49A1F; --gold-soft:#F6E8C8; --red:#B3343F; --red-soft:#F7E1E3;
  --display:"Bricolage Grotesque","Noto Sans Ethiopic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic","Nyala",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121512; --surface:#1B201C; --sunk:#161a17; --line:#2E352F;
  --ink:#ECEEE8; --muted:#A3A99F;
  --accent:#43C3A0; --accent-ink:#062019; --accent-soft:#163A30;
  --gold:#E6B24A; --gold-soft:#3A2F17; --red:#E4707A; --red-soft:#3D1F22; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;font-weight:800}
:lang(am) h1,:lang(am) h2,:lang(am) h3{font-family:"Noto Sans Ethiopic",var(--body);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tibeb{height:9px;background:repeating-linear-gradient(90deg,var(--accent) 0 12px,var(--gold) 12px 16px,var(--red) 16px 20px,var(--gold) 20px 24px,var(--accent) 24px 36px,var(--gold) 36px 38px)}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{text-decoration:none;color:var(--ink);min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;line-height:1.1;color:var(--ink)}
.logo .lg-am{font-family:"Noto Sans Ethiopic",var(--body);font-weight:700;color:var(--accent);letter-spacing:0;position:relative;padding-bottom:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,var(--gold) 8px 11px,var(--red) 11px 14px,var(--gold) 14px 17px) left bottom/100% 3px no-repeat}
.brand small{margin-top:3px}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.lang button{border:0;background:transparent;padding:7px 10px;font-size:13px;cursor:pointer;min-height:36px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
main{padding-top:20px;padding-bottom:48px}
.hero{border-radius:var(--r);background:var(--accent);color:var(--accent-ink);padding:22px 20px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:0;right:0;bottom:0;width:40%;opacity:.15;background:linear-gradient(45deg,transparent 46%,var(--accent-ink) 46%,var(--accent-ink) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--accent-ink) 46%,var(--accent-ink) 54%,transparent 54%);background-size:26px 26px}
.hero>*{position:relative}
.hero h1{font-size:clamp(24px,6vw,38px);max-width:20ch}
.hero p{margin:10px 0 0;max-width:60ch;opacity:.92}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:20px}
.sub{color:var(--muted);margin:6px 0 14px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 16px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{display:block;font-size:13.5px;font-weight:700}
label>input,label>select,label>textarea{display:block;margin-top:5px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:400;font-size:16px}
textarea{min-height:80px;resize:vertical}
.fields{display:grid;gap:12px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.tabs button{flex:1;border:0;background:var(--surface);padding:10px;min-height:44px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.auth{max-width:440px;margin:0 auto}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;margin:0}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--accent-soft)}
.status{border-radius:var(--r);padding:14px 16px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);border-left:5px solid var(--gold)}
.status.approved{border-left-color:var(--accent)}
.status.rejected,.status.suspended{border-left-color:var(--red)}
.status b{display:block;font-size:15.5px}
.status p{margin:4px 0 0;color:var(--muted);font-size:14px}
.layout{display:grid;gap:16px}
.list{display:grid;gap:10px}
.prod{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.thumb{width:72px;height:72px;border-radius:8px;background:var(--sunk);object-fit:cover}
.prod h3{font-family:var(--body);font-size:15px;font-weight:700;overflow-wrap:anywhere;word-wrap:break-word}
.meta{color:var(--muted);font-size:13px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:4px}
.pill.pending{background:var(--gold-soft);color:var(--ink)}
.pill.approved{background:var(--accent-soft);color:var(--accent)}
.pill.rejected{background:var(--red-soft);color:var(--red)}
.pill.sold{background:var(--sunk);color:var(--muted)}
.prod .ctl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.anote{grid-column:1/-1;font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.preview{width:100%;max-width:100%;height:200px;object-fit:cover;border-radius:10px;background:var(--sunk)}
.rules{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.rules li{margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.roles{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;min-width:0}
.roles legend{font-size:13.5px;font-weight:700;padding:0 6px}
label.check{display:flex;align-items:flex-start;font-weight:400;font-size:14.5px;padding:6px 0;cursor:pointer}
label.check input{width:20px;height:20px;min-height:0;margin:2px 10px 0 0;flex:none;accent-color:var(--accent)}
label.check b{display:block;font-size:14.5px}
.supgrid{display:grid;grid-template-columns:1fr;gap:2px}
#gfArea{margin-bottom:16px}
#gfArea h2{font-size:20px}
@media (min-width:640px){.supgrid{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-top:14px;padding-bottom:18px;color:var(--muted);font-size:13.5px}
.brand b{white-space:nowrap}
@media (max-width:420px){.brand b{font-size:17px}.bar .row{gap:6px;flex-wrap:nowrap}.bar .btn.sm{padding:6px 10px;min-height:36px;font-size:13px}.lang button{padding:7px 8px}}
@media (min-width:640px){.fields.cols{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}.hero{padding:30px 28px}}
@media (min-width:900px){.layout{grid-template-columns:400px minmax(0,1fr);align-items:start}}
</style>
</head>
<body>
<header>
  <div class="tibeb" aria-hidden="true"></div>
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="Selam Market"><b class="logo"><span class="lg-am" lang="am">ሰላም</span> Market</b><small data-t="portal"></small></a>
    <div class="row">
      <button class="btn ghost sm" id="logout" type="button" data-t="sign_out" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="am" lang="am">አማ</button>
        <button type="button" data-lang="om" lang="om">Oro</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
  </div>

  <!-- Sign up / sign in -->
  <section id="authView" class="auth" hidden>
    <div class="panel">
      <div class="tabs" role="group">
        <button type="button" id="tabUp" aria-pressed="true" data-t="signup"></button>
        <button type="button" id="tabIn" aria-pressed="false" data-t="signin"></button>
      </div>
      <form id="authForm" class="fields" novalidate>
        <label><span data-t="email"></span><input id="email" type="email" inputmode="email" autocomplete="email" required></label>
        <label><span id="pwLabel" data-t="password"></span><input id="password" type="password" autocomplete="new-password" required></label>
        <p id="authMsg" class="msg" hidden></p>
        <div id="capAuth"></div>
        <button class="btn pri" type="submit" id="authBtn" data-t="signup"></button>
        <p class="hint" id="privNote"></p>
      </form>
      <p class="sub" style="margin:14px 0 0" id="help1"></p>
    </div>
  </section>

  <!-- Shop profile -->
  <section id="profileView" hidden>
    <div class="panel" style="max-width:720px;margin:0 auto">
      <h2 data-t="profile_t"></h2>
      <p class="sub" data-t="profile_s"></p>
      <form id="profileForm" class="fields cols" novalidate>
        <label><span data-t="biz"></span><input id="biz" required></label>
        <label><span data-t="owner"></span><input id="owner" required autocomplete="name"></label>
        <label><span data-t="phone"></span><input id="phone" type="tel" inputmode="tel" placeholder="+251 9__ ___ ___" required autocomplete="tel"></label>
        <label><span data-t="telegram"></span><input id="tg" placeholder="@username"></label>
        <label><span data-t="area"></span><select id="area"></select></label>
        <label class="full"><span data-t="about"></span><textarea id="about"></textarea></label>
        <fieldset class="full roles"><legend data-t="roles_t"></legend>
          <label class="check"><input type="checkbox" id="wantMk" checked><span><b data-t="role_mk"></b><span class="hint" data-t="role_mk_s"></span></span></label>
          <label class="check"><input type="checkbox" id="wantGf"><span><b data-t="role_gf"></b><span class="hint" data-t="role_gf_s"></span></span></label>
        </fieldset>
        <p id="profileMsg" class="msg full" hidden></p>
        <div class="row full"><button class="btn pri" type="submit" id="profileBtn" data-t="save_profile"></button><button class="btn ghost" type="button" id="profileCancel" data-t="cancel" hidden></button></div>
      </form>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashView" hidden>
    <div id="statusBox" class="status"></div>
    <div class="row" style="justify-content:flex-end;margin:-6px 0 16px"><button class="btn ghost sm" type="button" id="editProfile" data-t="edit_profile"></button></div>

    <form id="gfArea" class="panel fields" novalidate hidden>
      <div class="row" style="justify-content:space-between"><h2 data-t="gf_t"></h2><span class="pill" id="gfPill" hidden></span></div>
      <p class="sub" style="margin:0" data-t="gf_s"></p>
      <p class="msg" id="gfNote" hidden></p>
      <fieldset class="roles"><legend data-t="gf_sup"></legend><div class="supgrid" id="gfSupplies"></div></fieldset>
      <label class="check"><input type="checkbox" id="gfAddis" checked><span data-t="gf_addis"></span></label>
      <label><span data-t="gf_cities"></span><input id="gfCities" placeholder="Adama, Bishoftu"></label>
      <label><span data-t="gf_prices"></span><span class="hint" data-t="gf_prices_h"></span><textarea id="gfPrices"></textarea></label>
      <label><span data-t="gf_cap"></span><input id="gfCap" inputmode="numeric"></label>
      <p id="gfMsg" class="msg" hidden></p>
      <div class="row"><button class="btn pri" type="submit" id="gfBtn" data-t="gf_save"></button></div>
    </form>

    <div class="layout" id="mkArea">
      <form id="prodForm" class="panel fields" novalidate>
        <h2 id="prodTitle" data-t="add_t"></h2>
        <label><span data-t="p_name"></span><input id="pname" required></label>
        <label><span data-t="p_cat"></span><select id="pcat"></select></label>
        <label><span data-t="p_cond"></span><select id="pcond"></select></label>
        <label><span data-t="p_price"></span><span class="hint" data-t="p_price_hint"></span><input id="pprice" type="number" inputmode="decimal" min="0" step="1" required></label>
        <label><span data-t="p_qty"></span><input id="pqty" type="number" inputmode="numeric" min="1" step="1" value="1"></label>
        <label><span data-t="p_weight"></span><input id="pweight" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.5"></label>
        <label><span data-t="p_desc"></span><textarea id="pdesc"></textarea></label>
        <label><span data-t="p_photo"></span><input id="pphoto" type="file" accept="image/*"></label>
        <img id="ppreview" class="preview" alt="" hidden>
        <p class="hint" id="editWarn" data-t="p_edit_warn" hidden></p>
        <p id="prodMsg" class="msg" hidden></p>
        <div class="row"><button class="btn pri" type="submit" id="prodBtn" data-t="p_save_add"></button><button class="btn ghost" type="button" id="prodCancel" data-t="cancel" hidden></button></div>
        <div>
          <b data-t="rules_t"></b>
          <ul class="rules"><li data-t="rule1"></li><li data-t="rule2"></li><li data-t="rule3"></li></ul>
        </div>
      </form>
      <section style="min-width:0">
        <h2 style="font-size:20px;margin-bottom:10px" data-t="products_t"></h2>
        <div class="list" id="list"></div>
      </section>
    </div>
  </section>
</main>

<footer><div class="wrap"><a href="./" data-t="back_shop"></a> · <a href="./#privacy" data-t="privacy"></a> · <span id="help2"></span></div></footer>

  ["holiday",["Holiday packages","የበዓል እሽጎች","Paakeejii ayyaanaa"]],
  ["bakery",["Cakes and bakery","ኬክና ዳቦ ቤት","Keekii fi daabboo"]],
  ["flowers",["Flowers","አበባ","Abaaboo"]],
  ["phones",["Phones and electronics","ስልክና ኤሌክትሮኒክስ","Bilbilaa fi elektirooniksii"]],
  ["clothing",["Clothing","አልባሳት","Uffata"]],
  ["other",["Other","ሌላ","Kan biraa"]]];
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var lang=store("sm-lang")||"en";if(!S[lang])lang="en";
function t(k,v){var s=S[lang][k]!=null?S[lang][k]:(S.en[k]||"");if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
function tr(map,key){var r=map[key];return r?r[LI[lang]]:key}
function birr(n){return Math.round(n).toLocaleString("en-US")+" "+(lang==="am"?"ብር":"Br")}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},2600)}
function msg(el,text,kind){el.hidden=!text;el.className="msg "+(kind||"err")+(el.classList.contains("full")?" full":"");el.textContent=text||""}

var sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
var mode="up", me=null, seller=null, products=[], editing=null, photoBlob=null, confirmId=null, editingProfile=false, partner=null;

function fillSelects(){
  var a=$("#area").value,c=$("#pcat").value,d=$("#pcond").value;
  $("#area").innerHTML=C.pickupAreas.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+"</option>"}).join("");
  $("#pcat").innerHTML=C.categories.map(function(x){return '<option value="'+esc(x)+'">'+esc(tr(I.CATS,x))+"</option>"}).join("");
  $("#pcond").innerHTML=C.conditions.map(function(x){return '<option value="'+esc(x)+'">'+esc(tr(I.CONDS,x))+"</option>"}).join("");
  if(a)$("#area").value=a;if(c)$("#pcat").value=c;if(d)$("#pcond").value=d;
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"))});
  $$("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===lang?"true":"false")});
  $("#help1").textContent=$("#help2").textContent=t("help",{tg:C.telegram});
  var pl=t("priv_note").split("{link}");$("#privNote").innerHTML=esc(pl[0])+'<a href="./#privacy" target="_blank" rel="noopener">'+esc(t("priv_link"))+"</a>"+esc(pl[1]||"");
  renderSupplies();
  setMode(mode);fillSelects();window.SelamCaptcha.mount($("#capAuth"),lang);
  $("#prodTitle").textContent=t(editing?"edit_t":"add_t");$("#prodBtn").textContent=t(editing?"p_save_edit":"p_save_add");
  $("#profileBtn").textContent=t(seller?"save_changes":"save_profile");
  if(seller){renderStatus();renderList();renderPartner()}
}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-lang]");if(b){lang=b.getAttribute("data-lang");store("sm-lang",lang);applyLang()}});

function show(view){["authView","profileView","dashView"].forEach(function(v){$("#"+v).hidden=v!==view});$("#logout").hidden=view==="authView"}

/* ---------- auth ---------- */
function setMode(m){mode=m;$("#tabUp").setAttribute("aria-pressed",m==="up");$("#tabIn").setAttribute("aria-pressed",m==="in");
  $("#authBtn").textContent=t(m==="up"?"signup":"signin");$("#pwLabel").textContent=t(m==="up"?"password":"password_in");
  $("#password").setAttribute("autocomplete",m==="up"?"new-password":"current-password")}
$("#tabUp").onclick=function(){setMode("up");msg($("#authMsg"))};
$("#tabIn").onclick=function(){setMode("in");msg($("#authMsg"))};
$("#authForm").addEventListener("submit",function(e){e.preventDefault();
  var email=$("#email").value.trim(),pw=$("#password").value,box=$("#authMsg");
  if(!/^\S+@\S+\.\S+$/.test(email)){msg(box,t("err_email"));return}
  if(mode==="up"&&pw.length<8){msg(box,t("err_short"));return}
  $("#authBtn").disabled=true;msg(box);
  var cap=window.SelamCaptcha;
  cap.token($("#capAuth")).then(function(tok){
  if(tok===null){$("#authBtn").disabled=false;msg(box,t("err_captcha"));return}
  var req=mode==="up"?sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:location.origin+location.pathname,captchaToken:tok}}):sb.auth.signInWithPassword({email:email,password:pw,options:{captchaToken:tok}});
  req.then(function(r){$("#authBtn").disabled=false;cap.reset($("#capAuth"));
    if(r.error){msg(box,mode==="up"?t("err_signup",{e:r.error.message}):t("err_signin"));return}
    if(mode==="up"&&!r.data.session){setMode("in");msg(box,t("check_email"),"ok");return}
    start();
  });
  });
});
$("#logout").onclick=function(){sb.auth.signOut().then(function(){location.reload()})};

/* ---------- profile ---------- */
function openProfile(edit){editingProfile=edit;show("profileView");$("#profileCancel").hidden=!edit;
  $("#profileBtn").textContent=t(seller?"save_changes":"save_profile");
  if(seller){$("#biz").value=seller.business_name;$("#owner").value=seller.owner_name;$("#phone").value=seller.phone;$("#tg").value=seller.telegram||"";$("#area").value=seller.area;$("#about").value=seller.about||"";
    $("#wantMk").checked=seller.wants_marketplace!==false;$("#wantGf").checked=!!seller.wants_gifts}}
$("#profileCancel").onclick=function(){show("dashView")};
$("#editProfile").onclick=function(){openProfile(true)};
$("#profileForm").addEventListener("submit",function(e){e.preventDefault();var box=$("#profileMsg");
  var row={business_name:$("#biz").value.trim(),owner_name:$("#owner").value.trim(),phone:$("#phone").value.trim(),telegram:$("#tg").value.trim().replace(/^@/,"")||null,area:$("#area").value,about:$("#about").value.trim()||null};
  if(!row.business_name||!row.owner_name||!row.phone){msg(box,t("err_req"));return}
  row.wants_marketplace=$("#wantMk").checked;row.wants_gifts=$("#wantGf").checked;
  if(!row.wants_marketplace&&!row.wants_gifts){msg(box,t("role_need"));return}
  $("#profileBtn").disabled=true;msg(box);
  var q=seller?sb.from("sellers").update(row).eq("user_id",me.id):sb.from("sellers").insert(Object.assign({user_id:me.id},row));
  q.then(function(r){$("#profileBtn").disabled=false;if(r.error){msg(box,t("err_save")+" ("+(r.error.message||r.error.code||"error")+")");return}
    toast(seller?t("saved"):t("submitted"));loadSeller()});
});

/* ---------- dashboard ---------- */
function renderStatus(){var s=seller.status,b=$("#statusBox");b.className="status "+s;
  b.innerHTML="<b>"+esc(t("st_"+s+"_b"))+"</b><p>"+esc(t("st_"+s))+"</p>"+(seller.admin_note&&s!=="approved"?"<p>"+esc(t("note_from",{n:seller.admin_note}))+"</p>":"")}
function renderList(){var L=$("#list");
  if(!products.length){L.innerHTML='<p class="empty">'+esc(t("no_products"))+"</p>";return}
  L.innerHTML=products.map(function(p){return '<article class="prod">'+(p.photo_url?'<img class="thumb" src="'+esc(p.photo_url)+'" alt="" loading="lazy">':'<div class="thumb"></div>')+
    '<div style="min-width:0"><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(tr(I.CATS,p.category))+" · "+esc(t("qty_short",{q:p.quantity}))+'</div><div class="price">'+birr(p.price_etb)+'</div><span class="pill '+p.status+'">'+esc(t("s_"+p.status))+"</span></div>"+
    (p.admin_note&&p.status==="rejected"?'<div class="anote">'+esc(t("note_from",{n:p.admin_note}))+"</div>":"")+
    '<div class="ctl">'+(confirmId===p.id?'<span style="align-self:center">'+esc(t("del_confirm"))+'</span><button type="button" class="btn danger sm" data-delyes="'+p.id+'">'+esc(t("del"))+'</button><button type="button" class="btn ghost sm" data-delno>'+esc(t("keep"))+"</button>":
      '<button type="button" class="btn ghost sm" data-edit="'+p.id+'">'+esc(t("edit"))+"</button>"+(p.status!=="sold"?'<button type="button" class="btn ghost sm" data-sold="'+p.id+'">'+esc(t("mark_sold"))+"</button>":"")+'<button type="button" class="btn ghost sm" data-del="'+p.id+'">'+esc(t("del"))+"</button>")+"</div></article>"}).join("")}
function find(id){for(var i=0;i<products.length;i++)if(String(products[i].id)===String(id))return products[i]}
$("#list").addEventListener("click",function(e){var el=e.target.closest("button");if(!el)return;
  if(el.hasAttribute("data-edit"))startEdit(find(el.getAttribute("data-edit")));
  if(el.hasAttribute("data-del")){confirmId=+el.getAttribute("data-del");renderList()}
  if(el.hasAttribute("data-delno")){confirmId=null;renderList()}
  if(el.hasAttribute("data-delyes")){var p=find(el.getAttribute("data-delyes"));
    sb.from("seller_products").delete().eq("id",p.id).then(function(r){if(r.error){toast(t("err_save"));return}
      if(p.photo_url){var path=p.photo_url.split("/seller-photos/")[1];if(path)sb.storage.from("seller-photos").remove([path])}
      confirmId=null;if(editing===p.id)resetForm();toast(t("deleted"));loadProducts()})}
  if(el.hasAttribute("data-sold")){sb.from("seller_products").update({status:"sold"}).eq("id",el.getAttribute("data-sold")).then(function(r){if(r.error)toast(t("err_save"));else loadProducts()})}
});

function startEdit(p){editing=p.id;photoBlob=null;
  $("#pname").value=p.name;$("#pcat").value=p.category;$("#pcond").value=p.condition;$("#pprice").value=p.price_etb;$("#pqty").value=p.quantity;$("#pweight").value=p.weight_kg||"";$("#pdesc").value=p.description||"";$("#pphoto").value="";
  $("#ppreview").hidden=!p.photo_url;if(p.photo_url)$("#ppreview").src=p.photo_url;
  $("#prodTitle").textContent=t("edit_t");$("#prodBtn").textContent=t("p_save_edit");$("#prodCancel").hidden=false;$("#editWarn").hidden=false;msg($("#prodMsg"));
  $("#prodForm").scrollIntoView({behavior:"smooth",block:"start"})}
function resetForm(){editing=null;photoBlob=null;$("#prodForm").reset();$("#pqty").value=1;$("#ppreview").hidden=true;$("#ppreview").removeAttribute("src");
  $("#prodTitle").textContent=t("add_t");$("#prodBtn").textContent=t("p_save_add");$("#prodCancel").hidden=true;$("#editWarn").hidden=true;fillSelects()}
$("#prodCancel").onclick=function(){resetForm();msg($("#prodMsg"))};

function shrink(file,max){return new Promise(function(res,rej){var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",0.82)};
  img.onerror=function(){rej()};img.src=url})}
$("#pphoto").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;
  shrink(f,1200).then(function(b){photoBlob=b;$("#ppreview").src=URL.createObjectURL(b);$("#ppreview").hidden=false},function(){photoBlob=null;msg($("#prodMsg"),t("err_photo"))})});

$("#prodForm").addEventListener("submit",function(e){e.preventDefault();var box=$("#prodMsg");
  var name=$("#pname").value.trim(),price=parseFloat($("#pprice").value);
  if(!name||!(price>=0)){msg(box,t("err_req"));return}
  var cur=editing?find(editing):null;
  if(!photoBlob&&!(cur&&cur.photo_url)){msg(box,t("need_photo"));return}
  var row={name:name,category:$("#pcat").value,condition:$("#pcond").value,price_etb:price,quantity:Math.max(0,parseInt($("#pqty").value,10)||1),
    weight_kg:parseFloat($("#pweight").value)||null,description:$("#pdesc").value.trim()||null};
  $("#prodBtn").disabled=true;msg(box);
  var up=photoBlob?sb.storage.from("seller-photos").upload(me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg",photoBlob,{contentType:"image/jpeg"}):Promise.resolve(null);
  up.then(function(r){
    if(r&&r.error)throw new Error(t("err_photo")+" ("+(r.error.message||"error")+")");
    if(r){row.photo_url=sb.storage.from("seller-photos").getPublicUrl(r.data.path).data.publicUrl}
    return editing?sb.from("seller_products").update(row).eq("id",editing):sb.from("seller_products").insert(Object.assign({seller_id:me.id},row));
  }).then(function(r){if(r.error){if(window.console)console.error(r.error);throw new Error(t("err_save")+" ("+(r.error.message||r.error.code||"error")+")")}
    if(cur&&row.photo_url&&cur.photo_url){var old=cur.photo_url.split("/seller-photos/")[1];if(old)sb.storage.from("seller-photos").remove([old])}
    toast(t("submitted"));resetForm();loadProducts();
  }).catch(function(err){msg(box,err&&err.message?err.message:t("err_save"))})
  .then(function(){$("#prodBtn").disabled=false});
});

/* ---------- load ---------- */
function loadProducts(){return sb.from("seller_products").select("*").eq("seller_id",me.id).order("created_at",{ascending:false}).then(function(r){products=r.data||[];renderList()})}
function loadSeller(){return sb.from("sellers").select("*").eq("user_id",me.id).maybeSingle().then(function(r){
  seller=r.data;if(!seller){openProfile(false);return}
  var mk=seller.wants_marketplace!==false,gf=!!seller.wants_gifts;
  show("dashView");renderStatus();$("#mkArea").hidden=!mk;$("#gfArea").hidden=!gf;
  if(mk)loadProducts();if(gf)loadPartner()})}

/* ---------- gift partner application ---------- */
function renderSupplies(){var picked={};$$("#gfSupplies input:checked").forEach(function(x){picked[x.value]=1});
  if(partner&&!$$("#gfSupplies input").length)(partner.supplies||[]).forEach(function(k){picked[k]=1});
  $("#gfSupplies").innerHTML=SUP.map(function(s){return '<label class="check"><input type="checkbox" value="'+s[0]+'"'+(picked[s[0]]?" checked":"")+"><span>"+esc(s[1][LI[lang]])+"</span></label>"}).join("")}
function renderPartner(){var p=$("#gfPill"),n=$("#gfNote");
  if(!partner){p.hidden=true;n.hidden=true;$("#gfBtn").textContent=t("gf_save");return}
  var st=partner.status;p.hidden=false;p.className="pill "+(st==="suspended"?"rejected":st);p.textContent=t("gfs_"+st);
  $("#gfBtn").textContent=t("save_changes");
  var note=st==="rejected"?t("gfn_rejected"):st==="suspended"?t("gfn_suspended"):"";
  if(partner.admin_note&&st!=="approved")note+=(note?" ":"")+t("note_from",{n:partner.admin_note});
  msg(n,note,st==="rejected"||st==="suspended"?"err":"ok")}
function loadPartner(){return sb.from("gift_partners").select("*").eq("user_id",me.id).maybeSingle().then(function(r){
  partner=r.data||null;
  if(partner){$$("#gfSupplies input").forEach(function(x){x.checked=(partner.supplies||[]).indexOf(x.value)>-1});
    $("#gfAddis").checked=partner.delivers_addis!==false;$("#gfCities").value=partner.other_cities||"";$("#gfPrices").value=partner.price_notes||"";$("#gfCap").value=partner.capacity||""}
  renderPartner()})}
$("#gfArea").addEventListener("submit",function(e){e.preventDefault();var box=$("#gfMsg");
  var sup=$$("#gfSupplies input:checked").map(function(x){return x.value});
  if(!sup.length){msg(box,t("gf_need"));return}
  var row={supplies:sup,delivers_addis:$("#gfAddis").checked,other_cities:$("#gfCities").value.trim()||null,price_notes:$("#gfPrices").value.trim()||null,capacity:$("#gfCap").value.trim()||null};
  $("#gfBtn").disabled=true;msg(box);
  var q=partner?sb.from("gift_partners").update(row).eq("user_id",me.id):sb.from("gift_partners").insert(Object.assign({user_id:me.id},row));
  q.then(function(r){$("#gfBtn").disabled=false;
    if(r.error){msg(box,t("err_save")+" ("+(r.error.message||r.error.code||"error")+")");return}
    toast(partner?t("saved"):t("gf_sent"));loadPartner()})});
function start(){sb.auth.getUser().then(function(r){me=r.data&&r.data.user;if(!me||me.is_anonymous){me=null;show("authView");return}loadSeller()})}

applyLang();
sb.auth.getSession().then(function(r){if(r.data.session)start();else show("authView")});
})();
</script>
</body>
</html>
